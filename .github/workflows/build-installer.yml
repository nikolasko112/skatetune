name: Build macOS installer (VST3 + AU)

"on":
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Configure (universal binary: Apple Silicon + Intel)"
        run: |
          cmake -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build (VST3 + AU)
        run: cmake --build build --config Release -j4

      - name: Locate build artefacts
        run: |
          echo "VST3 bundle:"
          find build/SkateTune_artefacts -iname "*.vst3" -maxdepth 4
          echo "AU component:"
          find build/SkateTune_artefacts -iname "*.component" -maxdepth 4

      - name: Read version from CMakeLists.txt
        id: ver
        run: |
          VERSION=$(grep -oE 'project\(SkateTune VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+$')
          if [ -z "$VERSION" ]; then
            echo "Could not parse version from CMakeLists.txt" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building SkateTune v$VERSION (commit ${GITHUB_SHA:0:7})"

      - name: Build .pkg installer
        env:
          SKATETUNE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          chmod +x installer/build_pkg.sh
          ./installer/build_pkg.sh build installer_output

      - name: Zip raw plugin bundles (manual-install alternative)
        run: |
          mkdir -p installer_output
          ditto -c -k --sequesterRsrc \
            "build/SkateTune_artefacts/Release/VST3/SkateTune.vst3" \
            "installer_output/SkateTune-VST3-raw.zip"
          ditto -c -k --sequesterRsrc \
            "build/SkateTune_artefacts/Release/AU/SkateTune.component" \
            "installer_output/SkateTune-AU-raw.zip"

      - name: Upload installer + raw bundles
        uses: actions/upload-artifact@v4
        with:
          name: SkateTune-macOS
          path: installer_output/*
          if-no-files-found: error

      - name: Publish downloadable release (no GitHub login needed)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "SkateTune v${{ steps.ver.outputs.version }} - latest test build"
          body: |
            Double-click **SkateTune-Installer-1.0.0.pkg** to install the VST3 and AU plugin in Logic Pro.
            (That filename is kept fixed on purpose so an old download link never breaks - the file
            inside is always the latest build. `SkateTune-Installer-${{ steps.ver.outputs.version }}.pkg`
            is the exact same installer, named with the real version for clarity.)

            **Version:** ${{ steps.ver.outputs.version }} - built from commit `${{ github.sha }}`
          files: |
            installer_output/SkateTune-Installer-1.0.0.pkg
            installer_output/SkateTune-Installer-${{ steps.ver.outputs.version }}.pkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
